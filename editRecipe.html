<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe - Admin Dashboard</title>
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <header>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2>Edit Recipe</h2>
        <hr>
        <form id="editRecipeForm" onsubmit="handleFormSubmission(event)" style="display: none;">
            <input type="hidden" id="recipeId">
            <p>
                <label for="recipeName">Recipe Name:</label><br>
                <input type="text" id="recipeName" required style="width: 100%;">
            </p>
            <p>
                <label for="recipeCourse">Course:</label><br>
                <select id="recipeCourse" required style="width: 100%;">
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="dessert">Dessert</option>
                </select>
            </p>
            <p>
                <label for="recipeDescription">Description:</label><br>
                <textarea id="recipeDescription" rows="4" required style="width: 100%;"></textarea>
            </p>
            <hr>
            <h3>Ingredients</h3>
            <div id="ingredientsContainer"></div>
            <button type="button" onclick="addIngredientRow()">+ Add Another Ingredient</button>
            <hr>
            <h3>Preparation Steps</h3>
            <div id="stepsContainer"></div>
            <button type="button" onclick="addStepRow()">+ Add Another Step</button>
            <hr>
            <button type="submit" style="padding: 10px 20px; font-weight: bold;">Update Recipe</button>
        </form>
        <p id="errorMsg" style="color:red; display: none;">Recipe not found.</p>
    </main>
    <hr>
