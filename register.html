<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Register page</title>
</head>

<body>
    <header>
        <h1>&#9832; WFM </h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="ourRecipes.html">Our Recipes</a>
            <a href="aboutUs.html">About Us</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="profilePage.html">My Profile</a>
        </nav>
    </header>

    <center>
        <h2 text-align="center"> User Registeration </h2>
    </center>

    <form action="post">
        <fieldset>
            <legend>User_Registeration</legend>
            <div>
                <label for="text">user name </label>
                <input id="text" type="text" placeholder="enter user name" name="User name" required autofocus>
            </div>

            <div>
                <label for="E-mail"> E-mail </label>
                <input id="E-mail" type="E-mail" placeholder="enter E-mail" name="E-mail" required>
            </div>

            <div>
                <label for="Password">Password </label>
                <input id="Password" type="password" placeholder="enter your Password" name="Password" required>

            </div>

            <div>
                <label for="confirm"> confirm Password </label>
                <input id="confirm" type="password" placeholder="confirm your Password" name="confirm" required>
            </div>

            <div>
                <label for="Gender"> Gender </label>
                <input id="Gender" type="radio" name="Gender" value="Male" required> Male
                <input id="Gender" type="radio" name="Gender" value="Female" required> Female
            </div>

            <div>
                <label for="telephone">Telephone Number</label>
                <input id="telephone" type="tel" name="telephone" required>
            </div>
            <div>
                <label for="Birth date">Birth date</label>
                <input id="Birth date" type="date" name="Birth date">
            </div>

            <div>
                <label>Country</label>
                <input list="country" name="country">
                <datalist id="country">
                    <option value="Egypt"></option>
                    <option value="USA"></option>
                    <option value="UAE"></option>
                    <option value="other"></option>
                </datalist>
            </div>

            <input type="submit">
        </fieldset>

    </form>
</body>

</html>
