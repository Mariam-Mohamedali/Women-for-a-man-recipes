<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/root.css">
    <title>Register - WFM</title>
</head>

<body>
    <header>
        <h1>&#9832; WFM</h1>
        <nav id="main-nav"></nav>
    </header>

    <center>
        <h2>User Registration</h2>
    </center>

    <form id="registerForm">
        <fieldset>
            <legend>Create Account</legend>

            <div>
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Enter username" name="username" required autofocus>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="Enter e-mail" name="email" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" name="password" required>
            </div>

            <div>
                <label for="confirm">Confirm Password</label>
                <input id="confirm" type="password" placeholder="Confirm your password" name="confirm" required>
            </div>

            <div>
                <label>Account Type</label><br>
                <input id="role_user" type="radio" name="is_admin" value="false" required checked>
                <label for="role_user">Regular User</label>
                &nbsp;&nbsp;
                <input id="role_admin" type="radio" name="is_admin" value="true">
                <label for="role_admin">Admin</label>
            </div>
            <br>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </fieldset>
    </form>

    <div>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <p id="msg" style="color:red;"></p>

    <script src="assets/js/toast.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="navbar.js"></script>
    <script src="assets/js/register.js"></script>
</body>

</html>
