<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">

    <title>Login — WFM</title>
</head>
<a href="javascript:history.back()" class="back-arrow">&#8592;</a>

<body>
    <div class="login-hero">
        <div class="login-hero-text">
            <h2>Welcome Back</h2>
            <p>Sign in to access your saved recipes and favourites.</p>
        </div>
    </div>

    <main>
        <div class="login-card">
            <h2 class="card-title">Sign In</h2>


            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

                <div class="field">
                    <label for="E-mail">E-mail Address</label>
                    <input id="E-mail" type="email" placeholder="you@example.com" name="E-mail" autocomplete="email"
                        required>
                </div>

                <div class="field">
                    <label for="Password">Password</label>
                    <input id="Password" type="password" placeholder="Enter your password" name="Password"
                        autocomplete="current-password" required>
                </div>

                <div class="row-check">
                    <label class="check-label">
                        <input id="remember" type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
                <button type="reset" class="btn-secondary">Clear</button>

            </form>

            <p class="register-hint">New here? <a href="register.html">Create a free account &rarr;</a></p>
        </div>
    </main>


    <script src="assets/js/auth.js"></script>
    <script src="assets/js/recipes.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/login.js"></script>
</body>

</html>
