<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - WFM</title>
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        /* Confirm Modal */
        #confirmOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(61, 43, 31, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #confirmOverlay.active {
            display: flex;
        }

        #confirmBox {
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px 24px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(61, 43, 31, 0.18);
            text-align: center;
        }

        #confirmBox p {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--walnut);
            margin: 0 0 24px;
        }

        #confirmBox .confirm-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        #confirmBox .btn-cancel {
            background: var(--linen);
            color: var(--walnut);
        }

        #confirmBox .btn-cancel:hover {
            background: var(--sand);
        }

        #confirmBox .btn-delete {
            background: #c0392b;
        }

        #confirmBox .btn-delete:hover {
            background: #a93226;
        }
    </style>
</head>

<body>
    <header>        <nav id="main-nav"></nav>
    </header>

    <!-- Custom Delete Confirm Modal -->
    <div id="confirmOverlay">
        <div id="confirmBox">
            <p>Are you sure you want to delete this recipe?</p>
            <div class="confirm-btns">
                <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
                <button class="btn-delete" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <main>
        <h2>Admin Dashboard - Manage Recipes</h2>
        <hr>

        <a href="addRecipe.html"><button>+ Add New Recipe</button></a>

        <br><br>

        <table border="0" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Recipe Name</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="recipesTable">
                <tr>
                    <td colspan="4">Loading...</td>
                </tr>
            </tbody>
        </table>

        <script src="assets/js/toast.js"></script>
        <script src="assets/js/auth.js"></script>
        <script src="assets/js/recipes.js"></script>
        <script src="assets/js/navbar.js"></script>
        <script>
            requireAdmin();

            function renderTable() {
                const recipes = getRecipes();
                const tbody = document.getElementById('recipesTable');
                if (recipes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No recipes found.</td></tr>';
                    return;
                }
                tbody.innerHTML = recipes.map(r => `
                <tr>
                    <td data-label="ID">${r.id}</td>
                    <td data-label="Recipe Name">${r.name}</td>
                    <td data-label="Course">${r.course}</td>
                    <td data-label="Actions">
                        <a href="editRecipe.html?id=${r.id}"><button>Edit</button></a>
                        &nbsp;
                        <button class="btn-delete" onclick="handleDelete(${r.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
            }

            function handleDelete(id) {
                const overlay = document.getElementById('confirmOverlay');
                overlay.classList.add('active');
                document.getElementById('confirmDeleteBtn').onclick = function () {
                    deleteRecipe(id);
                    renderTable();
                    closeConfirm();
                    showToast('Recipe deleted.', 'info');
                };
            }

            function closeConfirm() {
                document.getElementById('confirmOverlay').classList.remove('active');
            }

            // Close on overlay click
            document.getElementById('confirmOverlay').addEventListener('click', function (e) {
                if (e.target === this) closeConfirm();
            });

            renderTable();
        </script>
    </main>
</body>

</html>
