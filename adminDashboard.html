<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - WFM</title>
    <link rel="stylesheet" href="assets/css/root.css">
</head>

<body>
    <header>
        <h1>&#9832; WFM</h1>
        <nav id="main-nav"></nav>
    </header>

    <h2>Admin Dashboard - Manage Recipes</h2>
    <hr>

    <a href="addRecipe.html"><button>+ Add New Recipe</button></a>
    <br><br>

    <table border="1" cellpadding="8" cellspacing="0" width="100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Recipe Name</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="recipesTable">
            <tr>
                <td colspan="4">Loading...</td>
            </tr>
        </tbody>
    </table>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/recipes.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script>
        requireAdmin();

        function renderTable() {
            const recipes = getRecipes();
            const tbody = document.getElementById('recipesTable');
            if (recipes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No recipes found.</td></tr>';
                return;
            }
            tbody.innerHTML = recipes.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.name}</td>
                    <td>${r.course}</td>
                    <td>
                        <a href="editRecipe.html?id=${r.id}"><button>Edit</button></a>
                        &nbsp;
                        <button onclick="handleDelete(${r.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function handleDelete(id) {
            if (confirm('Are you sure you want to delete this recipe?')) {
                deleteRecipe(id);
                renderTable();
            }
        }

        renderTable();
    </script>
</body>

</html>
