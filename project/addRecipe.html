<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Recipe - Admin Dashboard</title>
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <header>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2>Add New Recipe</h2>
        <hr>
        <form id="addRecipeForm" onsubmit="handleFormSubmission(event)">
            <p>
                <label for="recipeName">Recipe Name:</label><br>
                <input type="text" id="recipeName" required style="width: 100%;">
            </p>
            <p>
                <label for="recipeCourse">Course:</label><br>
                <select id="recipeCourse" required style="width: 100%;">
                    <option value="" disabled selected>Select Course</option>
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="dessert">Dessert</option>
                </select>
            </p>
            <p>
                <label for="recipeDescription">Description:</label><br>
                <textarea id="recipeDescription" rows="4" required style="width: 100%;"></textarea>
            </p>
            <p>
                <label for="recipeImage">Recipe Image:</label><br>
                <input type="file" id="recipeImage" accept="image/*">
            </p>
            <hr>
            <h3>Ingredients</h3>
            <div id="ingredientsContainer">
                <div class="ingredient-row" style="margin-bottom: 10px;">
                    <input type="text" placeholder="Ingredient Name" class="ing-name" required>
                    <input type="text" placeholder="Quantity (e.g., 2 cups)" class="ing-qty" required>
                </div>
            </div>
            <button type="button" onclick="addIngredientRow()">+ Add Another Ingredient</button>
            <hr>
            <h3>Preparation Steps</h3>
            <div id="stepsContainer">
                <div class="step-row" style="margin-bottom: 10px;">
                    <textarea rows="2" placeholder="Step description" class="step-desc" required
                        style="width: 100%;"></textarea>
                </div>
            </div>
            <button type="button" onclick="addStepRow()">+ Add Another Step</button>
            <hr>
            <button type="submit" style="padding: 10px 20px; font-weight: bold;">Save Recipe</button>
        </form>
    </main>
    <hr>
    <footer>
        <div class="footer-inner">
            <div class="footer-grid">
                <div class="footer-col">
                    <h4>FOLLOW US</h4>
                    <div class="social-links">
                        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>

                <div class="footer-col">
                    <h4>ABOUT</h4>
                    <p class="about-description">A curated space for those who value quality, authenticity, and
                        meaningful connection.</p>
                </div>

                <div class="footer-col">
                    <h4>GET IN TOUCH</h4>
                    <a href="contactUs.html" class="contact-pill-modern">Contact Us</a>
                    <p><i class="fas fa-envelope"></i> contact@wfm.com</p>
                    <p><i class="fas fa-phone"></i> +1 234 567 890</p>
                </div>
            </div>

            <div class="copyright">
                <p>© 2026 — Women For A Man. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/toast.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/recipes.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/addRecipe.js"></script>
</body>

</html>
