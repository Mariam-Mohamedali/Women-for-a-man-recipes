{% extends 'main/base.html' %}
{% load static %}

{% block title %}Our Recipes — WFM{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'main/css/recipeCards.css' %}">
<link rel="stylesheet" href="{% static 'main/css/ourRecipes.css' %}">
{% endblock %}

{% block content %}

<!-- ── Global Search ── -->
<section class="search-section">
    <h3>Looking for something specific?</h3>
    <form id="globalSearchForm">
        <div class="search-input-wrapper">
            <input id="recipe-search" type="text" placeholder="Search any recipe by name or ingredient..." value="{{ query|default:'' }}" autocomplete="off">
            <button type="button" id="clear-search" class="clear-btn">&times;</button>
        </div>
        <button type="submit" class="btn-search" id="search-trigger"><i class="fas fa-search"></i> Search</button>
    </form>
</section>

<!-- ── Category Cards ── -->
<section id="categoriesSection">
    <article class="cat-card" data-url="{% url "breakfast" %}" style="animation-delay: 0.05s;">
        <img src="{% static 'main/images/Acai-Smoothie-Bowl-With-Coconut-Water.jpg' %}" alt="Breakfast">
        <div class="article-body">
            <h3>Breakfast</h3>
            <button>See More →</button>
        </div>
    </article>

    <article class="cat-card" data-url="{% url "lunch" %}" style="animation-delay: 0.15s;">
        <img src="{% static 'main/images/Best-Loaded-Fries-1024x768.jpg' %}" alt="Lunch">
        <div class="article-body">
            <h3>Lunch</h3>
            <button>See More →</button>
        </div>
    </article>

    <article class="cat-card" data-url="{% url "dinner" %}" style="animation-delay: 0.25s;">
        <img src="{% static 'main/images/uEYux4vuQB6frgI11osi_GREAT_BUFFALO_CHICKEN_PIZZA_041.jpg' %}" alt="Dinner">
        <div class="article-body">
            <h3>Dinner</h3>
            <button>See More →</button>
        </div>
    </article>

    <article class="cat-card" data-url="{% url "dessert" %}" style="animation-delay: 0.35s;">
        <img src="{% static 'main/css/images/IMG_0009-d232a0e9649c4ea6bb38f81fc3011126.jpg' %}" alt="Dessert">
        <div class="article-body">
            <h3>Dessert</h3>
            <button>See More →</button>
        </div>
    </article>
</section>

<div id="recipe-results">
    {% if query %}
        {% include 'main/search.html' %}
    {% endif %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const searchForm = document.getElementById('globalSearchForm');
    const searchInput = document.getElementById('recipe-search');
    const clearBtn = document.getElementById('clear-search');
    const resultsContainer = document.getElementById('recipe-results');
    const categoriesSection = document.getElementById('categoriesSection');
    let debounceTimer;

    function performSearch(query) {
        if (query.trim().length > 0) {
            categoriesSection.style.display = 'none';
        } else {
            categoriesSection.style.display = 'grid';
            resultsContainer.innerHTML = ''; // Clear results when query is empty
            return; // Don't even fetch if empty, just show categories
        }

        const url = `{% url 'search' %}?q=${encodeURIComponent(query)}`;

        fetch(url, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.text())
        .then(html => {
            resultsContainer.innerHTML = html;
        })
        .catch(error => console.error('Error fetching search results:', error));
    }

    searchInput.addEventListener('input', function () {
        const query = this.value;
        clearBtn.style.display = query.length > 0 ? 'flex' : 'none';

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            performSearch(query);
        }, 300);
    });

    searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        performSearch(searchInput.value);
    });

    clearBtn.addEventListener('click', function () {
        searchInput.value = '';
        this.style.display = 'none';
        searchInput.focus();
        performSearch('');
    });

    if (searchInput.value.length > 0) {
        clearBtn.style.display = 'flex';
        categoriesSection.style.display = 'none';
    }

    // Category Card Navigation
    document.querySelectorAll('.cat-card').forEach(card => {
        card.addEventListener('click', function() {
            const url = this.getAttribute('data-url');
            if (url) window.location.href = url;
        });
    });
});
</script>

{% endblock %}
