{% extends 'main/base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'main/css/register.css' %}">
{% endblock %}

{% block content %}
<body>


    <div class="register-hero">

        <div class="register-hero-text">
            <h2>Join Our Community</h2>
            <p>Create an account and start saving your favourite recipes.</p>
        </div>
    </div>

    <main>

        <div class="register-card">
            <h2 class="card-title">Create Account</h2>
            <p class="card-subtitle">Already have an account? <a href="login.html">Sign in here</a></p>

            <form id="registerForm" novalidate>

                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" type="text" placeholder="Enter your username" name="username" required
                        autofocus>
                </div>

                <div class="field">
                    <label for="email">E-mail Address</label>
                    <input id="email" type="email" placeholder="you@example.com" name="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" name="password" required>
                </div>

                <div class="field">
                    <label for="confirm">Confirm Password</label>
                    <input id="confirm" type="password" placeholder="Confirm your password" name="confirm" required>
                </div>

                <div class="field">
                    <label>Account Type</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="is_admin" value="false" id="role_user" checked required>
                            Regular User
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="is_admin" value="true" id="role_admin">
                            Admin
                        </label>
                    </div>
                </div>

                <p id="msg" class="error-msg"></p>

                <button type="submit" class="btn-primary">Create Account</button>
                <button type="reset" class="btn-secondary">Clear</button>

            </form>
        </div>
    </main>

    
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/register.js"></script>

</body>

{% endblock %}
